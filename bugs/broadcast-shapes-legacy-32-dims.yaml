id: broadcast-shapes-legacy-32-dims
title: broadcast_shapes, broadcast_arrays and np.broadcast reject arrays with more than 32 dimensions
area: Broadcast
kind: inconsistent
severity: low
numpy_version: 2.5.4
source: _core/src/multiarray/iterators.c:124
property: NumpyLean.Broadcast.broadcastShapes_33_dims_refuted
summary: >
  NumPy 2.0 raised the maximum number of array dimensions from 32 to 64 (doc/source/release/2.0.0-notes.rst:82), and `a = np.empty((1,) * 40)` works, as does `a + a`. But `np.broadcast_shapes((1,) * 33)`, `np.broadcast_arrays(a, a)` and `np.broadcast(a)` raise `RuntimeError: this function only supports up to 32 dimensions but the array has 40.` The docstrings of these functions name no such limit, and the error type is RuntimeError, not ValueError. `broadcast_shapes` and `broadcast_arrays` both go through `_broadcast_shape` (lib/_stride_tricks_impl.py:526), which calls `np.broadcast`, and `multiiter_new_impl` (_core/src/multiarray/iterators.c:1279) builds an old-style iterator for each operand with `PyArray_IterNew`, which still stops at `NPY_MAXDIMS_LEGACY_ITERS` (iterators.c:124-129). `np.broadcast_to` uses `np.nditer` and accepts 64 dimensions, so `np.broadcast_to(a, (2,) + (1,) * 39)` works while `np.broadcast_arrays(a, a)` fails. The comment above `_broadcast_shape` says it uses the old iterator only because `np.nditer` did not handle size-0 arrays consistently. The C API reference (doc/source/reference/c-api/types-and-structures.rst:1221) does document `NPY_MAXDIMS_LEGACY_ITERS` for the old iterator structs, and the error message is explicit, so this is a low severity inconsistency in the Python functions rather than a hidden failure.
upstream: not searched
