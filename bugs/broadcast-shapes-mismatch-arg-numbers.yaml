id: broadcast-shapes-mismatch-arg-numbers
title: broadcast_shapes names the wrong arguments in the mismatch error after 64 arguments
area: Broadcast
kind: wrong-error
severity: low
numpy_version: 2.5.4
source: lib/_stride_tricks_impl.py:533
property: NumpyLean.Broadcast.broadcastShapes_mismatch_numbers_refuted
summary: >
  `np.broadcast_shapes(*[()] * 64, (2,), (3,))` raises "shape mismatch: objects cannot be broadcast to a single shape.  Mismatch is between arg 1 with shape (2,) and arg 2 with shape (3,).", but the arguments with those shapes are arg 64 and arg 65, and arg 1 and arg 2 are empty tuples. The message is built by `set_shape_mismatch_exception` (_core/src/multiarray/iterators.c:1128), which numbers the operands of one `np.broadcast` call. Above 64 arguments, `_broadcast_shape` (lib/_stride_tricks_impl.py:528-533) calls `np.broadcast(b, *args[pos:pos + 63])` for each chunk, where operand 0 is the shape broadcast so far, so the numbers in the message are positions inside the chunk and do not refer to the arguments that the user passed. The same happens in `np.broadcast_arrays` with more than 64 arguments.
upstream: not searched
