id: broadcast-zero-size-overflow-depends-on-position
title: np.broadcast and broadcast_shapes reject a zero-size shape when an overflowing product comes before the zero
area: Broadcast
kind: inconsistent
severity: low
numpy_version: 2.5.4
source: _core/src/multiarray/multiarraymodule.c:224
property: NumpyLean.Broadcast.broadcastShapes_single_identity_refuted
summary: >
  `np.broadcast_shapes((0, 2**62, 2))` returns `(0, 4611686018427387904, 2)`, but `np.broadcast_shapes((2**62, 2, 0))` raises "broadcast dimensions too large.", although both shapes have zero elements and a single shape should broadcast to itself. The array `np.empty((2**62, 2, 0), dtype=np.dtype([]))` exists, and `np.broadcast(a)` and `np.broadcast_arrays(a)` raise the same error on it. `PyArray_Broadcast` checks the size with `PyArray_OverflowMultiplyList` (_core/src/multiarray/iterators.c:1189), which returns 0 at the first zero entry (_core/src/multiarray/multiarraymodule.c:224-226) and -1 when a product before it overflows, so the answer depends on where the zero is. The array constructor does the opposite and checks the product of every nonzero entry wherever the zero is (_core/src/multiarray/ctors.c:725-757), and `np.nditer` keeps multiplying past a zero, which leaves the product at zero. Either rule is consistent, but `PyArray_OverflowMultiplyList` follows neither.
upstream: not searched
