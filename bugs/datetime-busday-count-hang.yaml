id: datetime-busday-count-hang
title: busday_count never returns for two dates more than 2**63 days apart
area: Datetime
kind: crash
severity: medium
numpy_version: 2.5.4
source: _core/src/multiarray/datetime_busday.c:416
property: NumpyLean.Datetime.busday_count_loop_bounded_refuted
summary: >
  `np.busday_count(np.datetime64(-2**63 + 1, 'D'), np.datetime64(2**63 - 1, 'D'))` spins forever, and so does the same call with -2**63 + 8 as the start. `apply_business_day_count` computes `whole_weeks = (date_end - date_begin) / 7` (datetime_busday.c:407) in `npy_int64`. When the dates are more than 2**63 days apart the subtraction wraps to a small or negative number, `whole_weeks` is too small, and the loop `while (date_begin < date_end)` at datetime_busday.c:416, which should run fewer than 7 times, steps one day at a time across about 2**64 days. Both dates are valid datetime64[D] values inside the span that arrays.datetime.rst gives for days. With dates 2**63 apart but not quite so far, for example -2**62 and 2**62, the call returns at once with the wrong sign (-6588122883467697005). The documentation does not mention any limit on the date range of busday_count.
upstream: KNOWN-OPEN https://github.com/numpy/numpy/pull/33185 (open PR from 30 Oct 2026 that adds an overflow check to busday_count and says it removes the unbounded loop), no issue, main has the old code
