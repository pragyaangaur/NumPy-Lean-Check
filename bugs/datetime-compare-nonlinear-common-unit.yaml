id: datetime-compare-nonlinear-common-unit
title: datetime64 years or months compare equal to a different day because the common unit gets a stray factor of 7
area: Datetime
kind: wrong-result
severity: medium
numpy_version: 2.5.4
source: _core/src/multiarray/datetime.c:1573
property: NumpyLean.Datetime.compare_equal_means_same_day_refuted
summary: >
  `np.datetime64('1971', 'Y') == np.datetime64(26, '14D')` is True, although the right side is 1970-12-31. `np.datetime64('1971', 'Y') == np.datetime64(1251, '7h')` is also True, with the right side at 1970-12-31T21. `np.result_type('M8[Y]', 'M8[14D]')` is `datetime64[7D]` and `np.result_type('M8[Y]', 'M8[7h]')` is `datetime64[7h]`, so the year is truncated to whole weeks or to seven hour steps before the comparison. In `compute_datetime_metadata_greatest_common_divisor` the branches for years and months say "Don't multiply num1 since there is no even factor" (datetime.c:1538, :1551, :1560, :1569), but the code then falls through to the "Take the greater base" block (datetime.c:1573-1588), which multiplies the year or month multiplier by `get_datetime_units_factor(Y, D)`. That walk passes the week entry of `_datetime_factors` (datetime.c:983) and returns 7, so the greatest common divisor picks up a factor of 7 whenever the other multiplier is divisible by 7. With multipliers that are not multiples of 7 the common unit is the plain finer unit and comparisons are right, which is why the bug is easy to miss. The documentation does not describe the common unit of nonlinear and linear units.
upstream: NEW, searched open and closed issues and PRs on 12 Nov 2026, closest is https://github.com/numpy/numpy/issues/12404 (astype to 7D, different cause), main still has the factor code in compute_datetime_metadata_greatest_common_divisor
