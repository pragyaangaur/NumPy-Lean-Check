id: datetime-nonlinear-cast-wraps
title: astype from datetime64 years or months to a finer unit wraps silently instead of raising OverflowError
area: Datetime
kind: inconsistent
severity: high
numpy_version: 2.5.4
source: _core/src/multiarray/dtype_transfer.c:1014
property: NumpyLean.Datetime.cast_nonlinear_preserves_or_raises_refuted
summary: >
  `np.array(['2300'], dtype='M8[Y]').astype('M8[ns]')` returns `['1715-06-13T00:25:26.290448384']` with no error, and casting that back to years gives 1715. The same instant held as days, `np.array(['2300-01-01'], dtype='M8[D]').astype('M8[ns]')`, raises `OverflowError: Overflow when converting between datetime64 units`. `get_nbo_cast_datetime_transfer_function` sends every datetime cast that involves years or months to `_strided_to_strided_datetime_general_cast` (dtype_transfer.c:1014-1025, :775), which converts through `npy_datetimestruct` with `NpyDatetime_ConvertDatetimeStructToDatetime64` (datetime.c:301). That function has no overflow check, while the linear casts use `_datetime_scale_with_overflow_check` (_datetime.h:354), whose comment explains that it exists so that a valid value never becomes NaT. The general path can also produce NaT from a valid value: the year value 2**63 - 1970 cast to datetime64[M] gives NaT. Comparisons between a year or month datetime and a finer one cast through the same path, so they compare wrapped values. The time span table in arrays.datetime.rst gives the ranges but says nothing about values outside them wrapping on some casts and raising on others.
upstream: KNOWN-OPEN https://github.com/numpy/numpy/pull/32218 (open PR that makes the Y and M cast path raise OverflowError, part of umbrella issue https://github.com/numpy/numpy/issues/31926), merged PR https://github.com/numpy/numpy/pull/31085 fixed only the linear unit casts
