id: datetime-year-week-print-wrap
title: datetime64 values in years or weeks near the int64 limits print as wrong dates or as NaT
area: Datetime
kind: wrong-result
severity: low
numpy_version: 2.5.4
source: _core/src/multiarray/datetime.c:483
property: NumpyLean.Datetime.to_struct_nat_only_from_nat_refuted
summary: >
  `a = np.array([2**63 - 1970], dtype='M8[Y]')` prints as `['NaT']` although `np.isnat(a)` is `[False]`, and `a.astype('M8[M]')` is NaT. `np.array([2**63 - 1], dtype='M8[Y]')` prints the year -9223372036854773839. `np.datetime64(2**61, 'W')` prints as `-6313183731939669-05-12`, a date before 1970 for a positive week count, while `np.datetime64(2**61, 'W').astype('M8[D]')` raises OverflowError. `NpyDatetime_ConvertDatetime64ToDatetimeStruct` computes `out->year = 1970 + dt` for years (datetime.c:483) and `set_datetimestruct_days(dt * 7, out)` for weeks (datetime.c:493) in `npy_int64` with no overflow check, although the same function checks the multiplier with `_datetime_scale_with_overflow_check` a few lines earlier (datetime.c:468). arrays.datetime.rst gives the span of years as +/- 9.2e18 years and of weeks as +/- 1.7e17 years, which covers these values. The values are extreme, so the severity is low.
upstream: KNOWN-OPEN https://github.com/numpy/numpy/issues/13197 (np.datetime64(big, 'W') overflows), also open PR https://github.com/numpy/numpy/pull/33199 and umbrella issue https://github.com/numpy/numpy/issues/31926, the years part is only covered by the umbrella
