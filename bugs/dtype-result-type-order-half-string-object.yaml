id: dtype-result-type-order-half-string-object
title: result_type and concatenate fail for float16, bytes and object in that order but give object in every other order
area: DType
kind: inconsistent
severity: medium
numpy_version: 2.5.4
source: _core/src/multiarray/dtypemeta.c:1091
property: NumpyLean.DType.result_type_order_independent_with_half_refuted
summary: >
  `np.result_type(np.float16, 'S3', object)` raises DTypePromotionError, while the other five orders of the same three dtypes return `object`. `np.concatenate([np.zeros(1, 'e'), np.array([b'abc']), np.array([None], object)])` fails the same way, and every other order of the three arrays concatenates to an object array. The comment on `PyArray_PromoteDTypeSequence` at common_dtype.c:157 says the reduction "should guarantee stable results even when changing the order". The cause is the type number of half. `default_builtin_common_dtype` at dtypemeta.c:1091 lets the DType with the larger type number decide, and its comment says "half is after all others, which works out here". Half has type number 23, larger than object (17), so `float16.__common_dtype__(object)` answers `object` itself instead of returning NotImplemented. The first pass of `reduce_dtypes_to_most_knowledgeable` (common_dtype.c:121-145) therefore never moves object to the front. The second pass pairs float16 with bytes, gets NotImplemented and swaps them, so bytes becomes the main DType. The final loop at common_dtype.c:244-287 only calls `main.__common_dtype__(other)`, and `string_unicode_common_dtype` (dtypemeta.c:1115) returns NotImplemented for object, which raises. With float32 in place of float16 the first pass moves object to the front and the result is `object`.
upstream: not searched
