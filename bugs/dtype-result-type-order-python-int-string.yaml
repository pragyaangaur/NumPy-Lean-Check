id: dtype-result-type-order-python-int-string
title: result_type with a bytes dtype, an integer dtype and a Python int depends on the order of the dtypes
area: DType
kind: inconsistent
severity: low
numpy_version: 2.5.4
source: _core/src/multiarray/common_dtype.c:121
property: NumpyLean.DType.result_type_order_independent_with_python_int_refuted
summary: >
  `np.result_type(np.int8, 'S3', 1)` returns `S4`, but `np.result_type('S3', np.int8, 1)` raises DTypePromotionError. The same happens with arrays and NumPy scalars, for example `np.result_type(np.int8(1), np.array([b'abc']), 1)` against `np.result_type(np.array([b'abc']), np.int8(1), 1)`, and with unicode in place of bytes. The comment on `PyArray_PromoteDTypeSequence` at common_dtype.c:157 says the reduction "should guarantee stable results even when changing the order". With bytes first, the first pass of `reduce_dtypes_to_most_knowledgeable` (common_dtype.c:121-145) pairs bytes with the Python int DType. Both `string_unicode_common_dtype` (dtypemeta.c:1118) and `int_common_dtype` (abstractdtypes.c:168) answer NotImplemented, so the pair is swapped. The second pass then pairs the Python int with int8 and swaps again, which makes int8 the main DType, and int8 does not know bytes, so the final loop at common_dtype.c:269 raises. With int8 first, int8 absorbs the Python int in the first pass and bytes later becomes the main DType, which gives `S4`. `np.result_type('S3', 1)` raises on its own, so the error is probably the intended answer and the `S4` result is the inconsistent one.
upstream: RELATED, searched open and closed issues and PRs on 12 Nov 2026, no issue describes this order dependence, closest is https://github.com/numpy/numpy/pull/10554 (docs say promote_types is not associative by design, older promotion code) and main has the same reduction code
