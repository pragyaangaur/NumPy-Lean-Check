id: indexing-int-index-overflow-error-kind
title: indexing with a Python int raises OverflowError for 2**63 up to 2**64 and IndexError above
area: Indexing
kind: inconsistent
severity: low
numpy_version: 2.5.4
source: _core/src/multiarray/mapping.c:587
property: NumpyLean.Indexing.pyIntIndex_error_kind_refuted
summary: >
  `prepare_index` tries `PyArray_PyIntAsIntp` on a Python int (mapping.c:373-389) and clears the error when the value does not fit. The value then goes through `PyArray_FROM_O` (mapping.c:400). For `2**63 <= i < 2**64` this gives a 0-d `uint64` array, and its conversion back to `intp` at mapping.c:587 raises `OverflowError: Python int too large to convert to C long`, which is not cleared. For `i >= 2**64` or `i < -2**63` it gives an object array and the result is `IndexError: only integers, slices ... are valid indices`. So `np.arange(5)[2**63]` raises OverflowError while `np.arange(5)[2**64]` and `np.arange(5)[2**63 - 1]` raise IndexError. Python lists raise IndexError for all of these, and code that catches IndexError around array indexing misses the middle band.
upstream: RELATED, searched open and closed issues and PRs on 12 Nov 2026, closest is https://github.com/numpy/numpy/issues/23607 (a scalar uint64 index raises OverflowError while an array wraps, closed without a fix, does not mention the IndexError band split) and main is unchanged
