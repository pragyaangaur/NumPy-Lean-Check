id: indexing-repeat-count-overflow
title: repeat wraps the output length on overflow and then writes past the end of the output buffer
area: Indexing
kind: memory
severity: high
numpy_version: 2.5.4
source: _core/src/multiarray/item_selection.c:934
property: NumpyLean.Indexing.repeat_length_refuted
summary: >
  `PyArray_Repeat` computes the length of the output axis as `total = counts[0] * n` when one count is broadcast (item_selection.c:934) and as `total += counts[j]` otherwise (item_selection.c:944). Neither has an overflow check. The array constructor then allocates `total` elements, but `npy_fastrepeat_impl` (item_selection.c:812-838) copies `counts[j]` elements for every `j` with no reference to `total`. When the true length overflows `npy_intp` and wraps to a small non-negative value, the copy runs far past the end of the new buffer. `np.repeat(np.arange(4), 2**62)` wraps the length to 0 and dies with SIGSEGV, and so do `np.repeat(np.arange(4), 2**62 + 1)` and `np.repeat(np.arange(4), [2**62 + 1] * 4)`, where the length wraps to 4. The documentation of `numpy.repeat` only says that `repeats` is "The number of repetitions for each element" and gives no limit. A large count should give the "array is too big" ValueError that the constructor raises for a length that does not wrap, for example `np.repeat(np.arange(4), 2**61 + 1)` raises "negative dimensions are not allowed" because the wrapped length is negative. This is heap memory corruption from a public function with ordinary Python integers, without `as_strided`.
upstream: not searched
