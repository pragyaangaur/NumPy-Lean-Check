id: intarith-scalar-power-overflow-silent
title: integer scalar power wraps on overflow without the warning that scalar multiply gives
area: IntArith
kind: inconsistent
severity: low
numpy_version: 2.5.4
source: _core/src/umath/scalarmath.c.src:244
property: NumpyLean.IntArith.power_scalar_warns_on_overflow_refuted
summary: >
  The promotion documentation (doc/source/reference/arrays.promotion.rst) says "NumPy warns when overflows occur for scalars, but not for arrays". Scalar add, subtract, multiply, negative, absolute and floor_divide follow this, and `np.int8(100) * np.int8(100)` returns 16 with "RuntimeWarning: overflow encountered in scalar multiply". `np.int8(100) ** np.int8(2)` returns the same wrapped value 16 with no warning, and so does every other overflowing integer scalar power such as `np.int64(10) ** np.int64(30)`. The cause is `@name@_ctype_power` at scalarmath.c.src:244-264, which multiplies in the squaring loop without any overflow check and always returns status 0, so the check of `retstatus` at scalarmath.c.src:1562 never fires. `@name@_ctype_multiply` at scalarmath.c.src:122 and :149 does check. The wrap itself is documented, the missing warning on the scalar path is not.
upstream: not searched
