id: libint-arange-uint64-range-float64
title: arange with Python integers in the uint64 range infers float64 and returns repeated values
area: LibInt
kind: inconsistent
severity: low
numpy_version: 2.5.4
source: _core/src/multiarray/ctors.c:3317
property: NumpyLean.LibInt.arange_default_dtype_distinct_refuted
summary: >
  Without a dtype, `PyArray_ArangeObj` starts the dtype discovery from `intp` ("intentionally made to be at least NPY_LONG", ctors.c:3317) and promotes it with the dtype of each argument through `PyArray_DescrFromObject` (ctors.c:3318-3331). A Python integer in `[2**63, 2**64)` is discovered as `uint64`, and `int64` with `uint64` promotes to `float64`, even when every argument fits `uint64`. `np.arange(2**63, 2**63 + 3)` therefore returns three equal `float64` values, and so does `np.arange(2**63 - 2, 2**63 + 1)`, although `range` gives three distinct integers. Even `np.arange(np.uint64(2**63), np.uint64(2**63 + 3))`, where every argument is already a `uint64` scalar, returns the same three equal `float64` values. The documentation says that `dtype` is inferred "from the other input arguments" and that `step` "is the distance between two adjacent values", which is 1 here but 0 in the result. The Warnings section only mentions overflow of `int32` and `int64` results for large values, not a silent change to `float64`.
upstream: RELATED, searched open and closed issues and pull requests on 12 Nov 2026, no report of this arange behaviour, same promotion cause as the open umbrella https://github.com/numpy/numpy/issues/20905 (uint64 with signed ints gives float64), main still starts the dtype from intp
