id: libint-digitize-int-bins-double-monotonic
title: digitize checks the direction of int64 bins on doubles, so it accepts non-monotonic bins and misreads decreasing ones
area: LibInt
kind: wrong-result
severity: medium
numpy_version: 2.5.4
source: _core/src/multiarray/compiled_base.c:295
property: NumpyLean.LibInt.digitize_decreasing_refuted
summary: >
  `digitize` calls `_monotonicity(bins)` (_function_base_impl.py:5766), which converts the bins to `double` (`PyArray_FROMANY(obj_x, NPY_DOUBLE, ...)` at compiled_base.c:295, with the comment "`x` is forced to double for this check") and runs `check_array_monotonic` (compiled_base.c:35) on the doubles. The search itself then runs `searchsorted` on the exact `int64` values. Neighbouring integers above `2**53` have the same double, so the two disagree. The strictly decreasing bins `[2**53 + 1, 2**53]` look constant as doubles and are taken as increasing, so `np.digitize([2**53], [2**53 + 1, 2**53])` returns `[2]` and `right=True` returns `[0]`, where the documented rule for decreasing bins (`bins[i-1] > x >= bins[i]`) gives 1 and 2. The bins `[2**53, 2**53 + 1, 2**53]` are not monotonic, but they are accepted without the documented "ValueError If bins is not monotonic", and the binary search on them gives an arbitrary answer. The documentation does not restrict the bins to values that are exact as doubles.
upstream: FIXED-ON-MAIN https://github.com/numpy/numpy/pull/32467 (merged 20 Sep 2026, closes https://github.com/numpy/numpy/issues/11022), the monotonicity check now runs in Python on the original dtype
