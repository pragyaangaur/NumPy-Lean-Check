id: libint-isin-sort-mixed-sign-float
title: isin reports false matches between int64 and uint64 arrays on the sort path, so the kinds disagree
area: LibInt
kind: wrong-result
severity: medium
numpy_version: 2.5.4
source: lib/_arraysetops_impl.py:933
property: NumpyLean.LibInt.isin_kinds_agree_refuted
summary: >
  The sort path of `_isin` concatenates the unique values of both inputs with `np.concatenate((ar1, ar2))` (_arraysetops_impl.py:933) and marks an element as found when its successor in the merge sorted array compares equal (_arraysetops_impl.py:942). For an `int64` array and a `uint64` array the concatenation promotes to `float64`, so distinct integers above `2**53` that round to the same double compare equal. `np.isin(np.array([2**62 + 1]), np.array([2**62] * 10, dtype=np.uint64), kind='sort')` returns `[True]`, while `kind='table'` and `kind=None` return `[False]`, and with only one test value (the loop path at _arraysetops_impl.py:917) the answer is also `[False]`. The default `kind=None` gives the wrong answer as soon as the test array has a range too large for the table, for example `np.isin(np.array([2**62 + 1]), np.array([0] + [2**62] * 10, dtype=np.uint64))` returns `[True]`. Two distinct `ar1` values that collide also mark each other as found. The documentation of `kind` says "This will not affect the final result" and the Notes say that `isin` is the element-wise version of the Python keyword `in`, which is exact. The loop and table paths compare `int64` with `uint64` exactly, so only the sort path is wrong.
upstream: not searched
