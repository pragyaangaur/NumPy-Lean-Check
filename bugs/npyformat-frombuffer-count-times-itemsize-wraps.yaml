id: npyformat-frombuffer-count-times-itemsize-wraps
title: frombuffer tests count*itemsize with a signed product that wraps, so a huge count gives "array is too big" instead of "buffer is smaller than requested size"
area: NpyFormat
kind: wrong-error
severity: low
numpy_version: 2.5.4
source: _core/src/multiarray/ctors.c:3809
property: NumpyLean.NpyFormat.frombuffer_large_count_refuted
summary: >
  `PyArray_FromBuffer` checks the requested count against the buffer with `if (s < n*itemsize)` (ctors.c:3809) and the message "buffer is smaller than requested size". Both operands are `npy_intp`, so the product overflows for large counts, which is undefined behaviour in C and wraps on arm64 and x86-64 builds. For `np.frombuffer(bytes(8), dtype='i8', count=2**61 + 1)` the product wraps to 8, the test passes, and the call fails later in the array constructor with "array is too big; arr.size * arr.dtype.itemsize is larger than the maximum possible size". The call is refused either way and no memory outside the buffer is used, because the constructor checks the size without wrapping. The same request therefore gets one error for counts up to about 2**60 and another above, and some counts such as 2**60 (product wraps to a negative number) also pass the test. The fix is a division, `n > s / itemsize`.
upstream: FIXED-ON-MAIN https://github.com/numpy/numpy/pull/31332 (merged 28 Sep 2026, a large dtype size change that incidentally replaced n*itemsize by n > s / itemsize), no issue found for this bug itself
