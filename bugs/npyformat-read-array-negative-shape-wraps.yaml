id: npyformat-read-array-negative-shape-wraps
title: read_array accepts a header with a negative dimension and returns a different, empty shape
area: NpyFormat
kind: wrong-result
severity: low
numpy_version: 2.5.4
source: lib/_format_impl.py:827
property: NumpyLean.NpyFormat.readArray_negative_shape_refuted
summary: >
  `_read_array_header` does not check the sign of the shape entries, and `read_array` turns the shape into an element count with `numpy.multiply.reduce(shape, dtype=numpy.int64)` (line 827), which wraps around silently. For the header shape `(-4294967296, 4294967296)` the exact product is -2**64, the wrapped count is 0, no data is needed, and `array.reshape(shape)` (line 887) then treats the negative entry as the unknown dimension (the behaviour recorded in shape-reshape-any-negative-is-unknown) and returns an array of shape `(0, 4294967296)`. A file that declares a negative dimension is invalid, and `np.zeros((-1, 2))` refuses such a shape, so the documented `ValueError` for invalid data is expected. The reproducer uses a dtype of itemsize zero so that no memory is allocated; with a real dtype the same header needs no data bytes either, because the wrapped count is 0.
upstream: not searched
