id: strings-ucs4-two-way-periodic-memcmp
title: find and count on a str_ array give wrong results for long haystacks with some long needles
area: Strings
kind: wrong-result
severity: medium
numpy_version: 2.5.4
source: _core/src/umath/string_fastsearch.h:673
property: NumpyLean.Strings.find_u_wrong_on_long_needle
summary: >
  `preprocess` decides whether the needle is periodic with `memcmp(needle.buffer, needle.buffer + p->period, (size_t) p->cut)`. `cut` counts characters but `memcmp` counts bytes, so for `npy_ucs4` only the first `cut` bytes, which is about a quarter of the characters, are compared. A needle that is not periodic can be taken for periodic, and `two_way` then skips windows it should check. `fastsearch` uses `two_way_find` and `two_way_count` for a haystack of 2500 or more characters with a needle of 100 or more (or a haystack of 30000 or more with a needle of 6 or more). For "a" repeated 2500 times and the needle "bb" plus 98 times "a", `np.strings.find` on a `U` array gives 1 and `count` gives 24, while `S`, `StringDType` and `str` give -1 and 0. The `S` and UTF-8 paths use one byte per character and are not affected. CPython's `fastsearch.h` multiplies the length by the character size. `replace` and `partition` on `U` use the same search. Random text does not trigger it, structured needles do.
upstream: not searched
