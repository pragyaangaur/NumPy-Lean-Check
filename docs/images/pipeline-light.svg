<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 210" width="980" height="210" role="img" aria-label="The method in five steps: read the C source, mirror it in Lean, race the model against NumPy, prove or refute properties, file the bug">
<rect width="980" height="210" rx="12" fill="#fcfcfb"/>
<text x="490.0" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#52514e">How a bug is found</text>
<rect x="24.0" y="46" width="172" height="120" rx="10" fill="#f1f0ec" stroke="#d8d6cf"/>
<circle cx="50.0" cy="74" r="14" fill="#2a78d6"/>
<text x="50.0" y="79" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
<text x="72.0" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Read the C</text>
<text x="38.0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">NumPy 2.5.4 source,</text>
<text x="38.0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">pinned to one commit</text>
<path d="M200.0 106.0 h6 m-7 -6 l7 6 l-7 6" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="214.0" y="46" width="172" height="120" rx="10" fill="#f1f0ec" stroke="#d8d6cf"/>
<circle cx="240.0" cy="74" r="14" fill="#2a78d6"/>
<text x="240.0" y="79" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
<text x="262.0" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Mirror it in Lean</text>
<text x="228.0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">same branches, same order,</text>
<text x="228.0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">same overflow points</text>
<path d="M390.0 106.0 h6 m-7 -6 l7 6 l-7 6" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="404.0" y="46" width="172" height="120" rx="10" fill="#f1f0ec" stroke="#d8d6cf"/>
<circle cx="430.0" cy="74" r="14" fill="#2a78d6"/>
<text x="430.0" y="79" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
<text x="452.0" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Race them</text>
<text x="418.0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">50,000 inputs on 3 seeds</text>
<text x="418.0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">must match NumPy exactly</text>
<path d="M580.0 106.0 h6 m-7 -6 l7 6 l-7 6" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="594.0" y="46" width="172" height="120" rx="10" fill="#f1f0ec" stroke="#d8d6cf"/>
<circle cx="620.0" cy="74" r="14" fill="#2a78d6"/>
<text x="620.0" y="79" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">4</text>
<text x="642.0" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Prove or refute</text>
<text x="608.0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">a claim about every input,</text>
<text x="608.0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">or find a counterexample</text>
<path d="M770.0 106.0 h6 m-7 -6 l7 6 l-7 6" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="784.0" y="46" width="172" height="120" rx="10" fill="#f1f0ec" stroke="#d8d6cf"/>
<circle cx="810.0" cy="74" r="14" fill="#2a78d6"/>
<text x="810.0" y="79" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">5</text>
<text x="832.0" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">File the bug</text>
<text x="798.0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">a record, a reproducer</text>
<text x="798.0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">and a tracker search</text>
<text x="490.0" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e">A mismatch in step 3 means the model is wrong and gets fixed. A refuted claim in step 4 that the real NumPy also shows is a bug.</text>
</svg>
